# Local Supabase config for the imMBA site.
# Remote project: zjtatzacyzstyshfjhaq (immba-backend)

project_id = "immba-website"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "http://127.0.0.1:4173"
additional_redirect_urls = ["http://127.0.0.1:8891", "https://immba.vercel.app"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
