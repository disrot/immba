<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in: imMBA</title>
    <meta name="description" content="imMBA announcement back-office login" />
    <meta name="theme-color" content="#163300" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="images/logo.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css?v=login8" />
  </head>
  <body class="login-page" data-title-key="login.title">
    <a class="skip-link" href="#main" data-i18n="skip">Skip to content</a>

    <header class="login-top" data-header>
      <a
        class="logo login-brand"
        href="index.html#top"
        data-i18n-attr="aria-label:brand.name"
        aria-label="Fu Jen Catholic University International MBA (imMBA)"
      >
        <img
          class="logo-img"
          src="images/logo.png?v=clear"
          alt="Fu Jen Catholic University International MBA (imMBA)"
          data-i18n-attr="alt:brand.name"
          width="32"
          height="32"
        />
        <span class="logo-text">
          <strong data-i18n="brand.short">imMBA</strong>
        </span>
      </a>
      <button type="button" class="lang-toggle" data-lang-toggle data-i18n="langButton" aria-label="Switch language">
        中文
      </button>
    </header>

    <main id="main" class="login-stage">
      <section class="login-card" data-login-card>
        <div class="login-mark" aria-hidden="true">
          <img src="images/logo.png?v=clear" alt="" width="56" height="56" />
        </div>
        <h1 data-login-title data-i18n="login.title">Sign in</h1>
        <p class="login-lede" data-login-lede data-i18n="login.staffLede">Continue to the back office.</p>
        <p class="login-aside">
          <span data-i18n="login.marketHint">Selling on Marketplace?</span>
          <a href="market-account.html" data-i18n="login.marketLink">Seller sign in</a>
        </p>
        <div class="login-switch" data-login-switch>
          <button type="button" data-login-mode="signin" aria-current="true" data-i18n="login.submit">Sign in</button>
          <button type="button" data-login-mode="register" data-i18n="login.register">Register</button>
        </div>
        <form class="login-form" data-login-form data-mode="signin" data-intent="staff">
          <div class="login-collapse" data-for-mode="register">
            <div class="login-collapse-inner">
              <label class="login-field">
                <span class="sr-only" data-i18n="login.name">Display name</span>
                <input type="text" name="displayName" autocomplete="name" data-i18n-attr="placeholder:login.name" placeholder="Display name" />
              </label>
            </div>
          </div>
          <label class="login-field">
            <span class="sr-only" data-i18n="login.user">Email or local admin username</span>
            <input type="text" name="email" autocomplete="username" required data-i18n-attr="placeholder:login.user" placeholder="Email or local admin username" />
          </label>
          <div class="login-collapse" data-for-mode="signin register newpass">
            <div class="login-collapse-inner">
              <label class="login-field">
                <span class="sr-only" data-i18n="login.pass">Password</span>
                <input type="password" name="password" autocomplete="current-password" data-i18n-attr="placeholder:login.pass" placeholder="Password" />
              </label>
            </div>
          </div>
          <div class="login-collapse" data-for-mode="signin">
            <div class="login-collapse-inner">
              <div class="login-aux">
                <label class="login-keep">
                  <input type="checkbox" name="remember" />
                  <span data-i18n="login.keep">Keep me signed in</span>
                </label>
                <button type="button" class="login-forgot" data-login-mode="reset" data-i18n="login.forgot">Forgot password?</button>
              </div>
            </div>
          </div>
          <p class="login-error" data-login-error data-i18n="login.error" hidden>Email or password is incorrect.</p>
          <button type="submit" class="btn btn-primary login-submit" data-login-submit data-i18n="login.submit">Sign in</button>
          <div class="login-collapse" data-for-mode="reset newpass">
            <div class="login-collapse-inner">
              <button type="button" class="login-back" data-login-mode="signin" data-i18n="login.back">Back to sign in</button>
            </div>
          </div>
        </form>
      </section>
    </main>

    <footer class="login-foot">
      <p>
        <a href="https://www.fju.edu.tw/" target="_blank" rel="noopener noreferrer" data-i18n="footer.privacy">Privacy</a>
        <a href="https://www.fju.edu.tw/" target="_blank" rel="noopener noreferrer" data-i18n="footer.legal">Legal</a>
        <a href="index.html#top" data-i18n="admin.site">View website</a>
      </p>
      <p>© <span data-year></span> <span data-i18n="footer.copy">Fu Jen Catholic University. All rights reserved.</span> <span class="footer-credit" data-i18n="footer.credit">— made by Nigel Pang (415416026)</span></p>
    </footer>
    <script type="module" src="js/main.js?v=notice4"></script>
    <script type="module" src="js/back-top.js?v=auth1"></script>
  </body>
</html>
