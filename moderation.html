<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moderation: imMBA</title>
    <script>
      var role = "";
      try {
        role = (JSON.parse(localStorage.getItem("immba-auth") || "null") || {}).role || "";
      } catch (error) {
        role = "";
      }
      if (role !== "admin" && role !== "super_admin") location.replace("login.html");
      else location.replace("dashboard.html#listings");
    </script>
  </head>
  <body></body>
</html>
