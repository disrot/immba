<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student portal: imMBA</title>
    <link rel="icon" href="images/logo.png" type="image/png" />
    <link rel="stylesheet" href="css/styles.css?v=secure1" />
  </head>
  <body>
    <main id="main" class="section">
      <p class="label">Student portal</p>
      <h1>Admissions, exchange, and graduation</h1>
      <p>Official university links stay in place. This portal saves a draft, then submits an immutable copy for review. Documents are not emailed.</p>
      <form data-application>
        <label>Workflow
          <select name="workflow">
            <option value="admissions">Admissions</option>
            <option value="exchange">Exchange</option>
            <option value="graduation">Graduation</option>
          </select>
        </label>
        <label>Full name <input name="full_name" required /></label>
        <label>Email <input name="email" type="email" required /></label>
        <label>Statement <textarea name="statement"></textarea></label>
        <button type="button" class="btn btn-ghost" data-save>Save draft</button>
        <button type="submit" class="btn btn-primary">Submit</button>
      </form>
      <p data-application-status></p>
      <p><a href="login.html">Sign in</a> · <a href="admissions.html">Official admissions page</a></p>
    </main>
    <script type="module" src="js/student-portal.js?v=secure1"></script>
  </body>
</html>
